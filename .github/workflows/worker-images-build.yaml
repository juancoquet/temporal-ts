name: Build container images

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build worker images
        uses: docker/bake-action@v7
        with:
          source: .
          set: |
            worker-base.cache-from=type=gha,scope=worker-base
            example-job.cache-from=type=gha,scope=example-job
            example-plan.cache-from=type=gha,scope=example-plan
            example-process.cache-from=type=gha,scope=example-process
