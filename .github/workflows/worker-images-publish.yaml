name: Publish container images

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}
  SOURCE_REPOSITORY: https://github.com/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish worker images
        uses: docker/bake-action@v7
        with:
          source: .
          push: true
          set: |
            worker-base.cache-from=type=gha,scope=worker-base
            worker-base.cache-to=type=gha,scope=worker-base,mode=max
            example-job.cache-from=type=gha,scope=example-job
            example-job.cache-to=type=gha,scope=example-job,mode=max
            example-plan.cache-from=type=gha,scope=example-plan
            example-plan.cache-to=type=gha,scope=example-plan,mode=max
            example-process.cache-from=type=gha,scope=example-process
            example-process.cache-to=type=gha,scope=example-process,mode=max
